name: agent

# A loop proof. It is the same self-retriggering mechanism as agent.yml, with a
# counter for a pass instead of the channel sync, so the whole chain - pass,
# verdict, `gh workflow run`, next run - can be watched on a real public repo
# without touching a channel or a credential.

on:
  workflow_dispatch:

concurrency:
  group: agent
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: one pass
        id: pass
        run: |
          set -u
          # A pass that increments a counter, so progress is real and the
          # stall detector has something to see change in.
          python agent.py -- python -c "
          import json, subprocess, sys
          try:
              n = json.load(open('agent_state.json'))['total']['n']
          except Exception:
              n = 0
          n += 1
          subprocess.run([sys.executable, 'agent.py', '--set-total',
                          json.dumps({'n': n})], check=True)
          print('pass', n)
          " 2>&1 | tee agent.log
          VERDICT=$(grep -o 'AGENT_VERDICT=.*' agent.log | tail -1 | cut -d= -f2)
          echo "verdict=${VERDICT:-done}" >> "$GITHUB_OUTPUT"

      - name: ask for the next run
        if: steps.pass.outputs.verdict == 'more'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent --ref "${GITHUB_REF_NAME}"

      - name: commit the counter
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'agent'
          git config user.email 'agent@users.noreply.github.com'
          git add agent_state.json
          git diff --cached --quiet && exit 0
          git commit -q -m 'agent: n'
          git push
